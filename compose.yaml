name: bikelog-local
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password}
      POSTGRES_DB: bikelog_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker and
      # expect the volume at /var/lib/postgresql. A new volume name leaves the
      # old PostgreSQL 17 volume (bikelog-local_postgres-data) untouched.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d bikelog_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres18-data:
