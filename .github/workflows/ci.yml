name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Same pinned image as compose.yaml; throwaway synthetic CI database on the
      # loopback port the integration fixture insists on.
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: bikelog
          POSTGRES_PASSWORD: ci-synthetic
          POSTGRES_DB: bikelog_dev
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U bikelog -d bikelog_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore BikeLog.slnx --locked-mode
      - name: Lint (CSharpier + warnings as errors)
        run: ./scripts/dev.sh lint
      - name: Write CI .env
        run: printf 'POSTGRES_USER=bikelog\nPOSTGRES_PASSWORD=ci-synthetic\n' > .env
      - name: Test (domain + PostgreSQL integration)
        run: ./scripts/dev.sh test --no-build --output Detailed

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # session-store.test.ts exercises the real session tables in PostgreSQL.
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: bikelog
          POSTGRES_PASSWORD: ci-synthetic
          POSTGRES_DB: bikelog_dev
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U bikelog -d bikelog_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write CI .env
        run: printf 'POSTGRES_USER=bikelog\nPOSTGRES_PASSWORD=ci-synthetic\n' > .env
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run typecheck --workspace @bikelog/api-client
      - name: Test (web, api-client, identity probe)
        run: npm test
      - run: npm run web:build

  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/hosted/install-bicep.sh
      - name: Build
        run: |
          az bicep build --file infra/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Lint (errors fail)
        run: |
          az bicep lint --file infra/bootstrap.bicep --diagnostics-format sarif
          az bicep lint --file infra/main.bicep --diagnostics-format sarif
      - name: Refuse role assignments in CI templates and excluded paid settings
        run: |
          set -u
          fail=0
          if grep -rnE 'Microsoft\.Authorization/(roleAssignments|roleDefinitions)' infra/main.bicep infra/modules/; then
            echo '::error::main.bicep and its modules must not create role assignments or definitions (research D3).'; fail=1
          fi
          for pattern in privateEndpoint "workloadProfileType: 'D" maintenanceConfigurations; do
            if grep -rn "$pattern" infra/; then
              echo "::error::'$pattern' adds Dedicated Plan Management charges (research D1)."; fail=1
            fi
          done
          exit $fail

  backup-scripts:
    name: backup-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore BikeLog.slnx --locked-mode
      # Builds the backup image, backs up a synthetic database it creates, and checks
      # that the restore comparison passes and catches damage (quickstart A2).
      - name: Backup and restore round trip
        run: scripts/hosted/tests/run.sh
