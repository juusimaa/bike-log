name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Same pinned image as compose.yaml; throwaway synthetic CI database on the
      # loopback port the integration fixture insists on.
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: bikelog
          POSTGRES_PASSWORD: ci-synthetic
          POSTGRES_DB: bikelog_dev
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U bikelog -d bikelog_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore BikeLog.slnx --locked-mode
      - name: Lint (CSharpier + warnings as errors)
        run: ./scripts/dev.sh lint
      - name: Write CI .env
        run: printf 'POSTGRES_USER=bikelog\nPOSTGRES_PASSWORD=ci-synthetic\n' > .env
      - name: Test (domain + PostgreSQL integration)
        run: ./scripts/dev.sh test --no-build --output Detailed

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # session-store.test.ts exercises the real session tables in PostgreSQL.
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: bikelog
          POSTGRES_PASSWORD: ci-synthetic
          POSTGRES_DB: bikelog_dev
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U bikelog -d bikelog_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Write CI .env
        run: printf 'POSTGRES_USER=bikelog\nPOSTGRES_PASSWORD=ci-synthetic\n' > .env
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run typecheck --workspace @bikelog/api-client
      - name: Test (web, api-client, identity probe)
        run: npm test
      - run: npm run web:build

  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/hosted/install-bicep.sh
      - name: Build
        run: |
          az bicep build --file infra/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: Lint (errors fail)
        run: |
          az bicep lint --file infra/bootstrap.bicep --diagnostics-format sarif
          az bicep lint --file infra/main.bicep --diagnostics-format sarif
      - name: Refuse role assignments in CI templates and excluded paid settings
        run: |
          set -u
          fail=0
          if grep -rnE 'Microsoft\.Authorization/(roleAssignments|roleDefinitions)' infra/main.bicep infra/modules/; then
            echo '::error::main.bicep and its modules must not create role assignments or definitions (research D3).'; fail=1
          fi
          for pattern in privateEndpoint "workloadProfileType: 'D" maintenanceConfigurations; do
            if grep -rn "$pattern" infra/; then
              echo "::error::'$pattern' adds Dedicated Plan Management charges (research D1)."; fail=1
            fi
          done
          exit $fail

  backup-scripts:
    name: backup-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore BikeLog.slnx --locked-mode
      # Builds the backup image, backs up a synthetic database it creates, and checks
      # that the restore comparison passes and catches damage (quickstart A2).
      - name: Backup and restore round trip
        run: scripts/hosted/tests/run.sh

  upcloud:
    name: upcloud
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.8@sha256:96d4a8c87dbbfb3bdd324f8fdc285fc3df5261e2decc619a4dd7e8ee52bbfd46
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -x
          scripts/upcloud/bikelog-deploy scripts/upcloud/install.sh scripts/upcloud/tests/run.sh
          scripts/upcloud/tests/lib.sh images/backup/backup.sh scripts/hosted/hosted.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color=false
      # quickstart L3: the example settings are enough for Compose to resolve the file.
      - name: Compose file
        run: |
          set -u
          tmp=$(mktemp -d)
          mkdir "$tmp/secrets"
          cp deploy/upcloud/compose.yaml "$tmp/"
          cp deploy/upcloud/settings.env.example "$tmp/settings.env"
          cp deploy/upcloud/secrets.example/*.env "$tmp/secrets/"
          printf '%s\n' WEB_IMAGE=w API_IMAGE=a MIGRATIONS_IMAGE=m BACKUP_IMAGE=b > "$tmp/release.env"
          docker compose --project-directory "$tmp" -f "$tmp/compose.yaml" --profile jobs \
            --env-file "$tmp/settings.env" --env-file "$tmp/release.env" config --format json > "$tmp/config.json"
          jq -e '
            (.services | keys) == ["api", "backup", "migrate", "ops", "web"]
            and all(.services[]; (.ports // []) == [])
            and all(.services[]; .mem_limit != null and .cpus != null)
            and all(.services[]; .logging.driver == "local" and .logging.options["max-size"] == "10m")
            and .services.api.network_mode == "service:web"
            and ([.services | to_entries[] | select(.value.networks.caddy != null) | .key] == ["web"])
            and all(.services | (.migrate, .ops, .backup); .profiles == ["jobs"])
          ' "$tmp/config.json" > /dev/null ||
            { echo '::error::deploy/upcloud/compose.yaml breaks a rule of contracts/server-layout.md.'; exit 1; }
          echo 'compose.yaml: no published ports; limits and bounded logs on every service; api in web namespace.'
      # quickstart L2, against a private Docker daemon with stand-in images.
      - name: Deploy script tests
        run: scripts/upcloud/tests/run.sh
