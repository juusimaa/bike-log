name: Deploy

# Deploys a published commit to the UpCloud server by image digest (spec 005,
# research D4 and D5; docs/hosting/upcloud.md "Deploy"):
#   - after Containers publishes a push to main;
#   - by hand:     gh workflow run deploy.yml -f image_tag=sha-<7 hex>
#   - rollback:    gh workflow run deploy.yml -f rollback=true
# The runner signs in over SSH with a key whose only use on the server is the forced
# command bikelog-deploy, which accepts deploy, rollback and status. The server's
# host key is pinned in UPCLOUD_SSH_KNOWN_HOSTS. UPCLOUD_HOST is a secret only so
# that GitHub masks it in these public logs.
#
# DISABLED until cutover step D1 (specs/005-upcloud-hosting/tasks.md T045): the job
# starts with `false &&`. Remove that to enable automatic deploys.
on:
  workflow_run:
    workflows: [Containers]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy, sha-<7 hex characters>; defaults to the commit dispatched from
        required: false
        type: string
      rollback:
        description: Roll back to the previous release instead (no migrations)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >-
      false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      DISPATCH_TAG: ${{ inputs.image_tag }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback }}
    steps:
      - name: Choose the image tag
        id: tag
        if: env.ROLLBACK != 'true'
        run: |
          if [ -n "$DISPATCH_TAG" ]; then tag=$DISPATCH_TAG; else tag="sha-${HEAD_SHA:0:7}"; fi
          [[ "$tag" =~ ^sha-[0-9a-f]{7}$ ]] || { echo "::error::image_tag must look like sha-abc1234, got '$tag'."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve image digests
        id: images
        if: env.ROLLBACK != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for image in web api migrations backup; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$image:$TAG" --format '{{json .Manifest}}' | jq -er .digest) ||
              { echo "::error::$REGISTRY/$image:$TAG was not found."; exit 1; }
            echo "$image=$REGISTRY/$image@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Prepare the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.UPCLOUD_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.UPCLOUD_SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo '::error::The UPCLOUD_DEPLOY_SSH_KEY environment secret is not set.'; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo '::error::The UPCLOUD_SSH_KNOWN_HOSTS environment variable is not set.'; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Deploy on the server
        id: deploy
        env:
          UPCLOUD_HOST: ${{ secrets.UPCLOUD_HOST }}
          TAG: ${{ steps.tag.outputs.tag }}
          WEB: ${{ steps.images.outputs.web }}
          API: ${{ steps.images.outputs.api }}
          MIGRATIONS: ${{ steps.images.outputs.migrations }}
          BACKUP: ${{ steps.images.outputs.backup }}
        run: |
          [ -n "$UPCLOUD_HOST" ] || { echo '::error::The UPCLOUD_HOST environment secret is not set.'; exit 1; }
          ssh_options=(-i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=30)
          if [ "$ROLLBACK" = true ]; then
            command=(rollback)
          else
            command=(deploy "$TAG" "$WEB" "$API" "$MIGRATIONS" "$BACKUP")
          fi
          # The forced command reads these words from SSH_ORIGINAL_COMMAND; they are
          # meant to expand here, on the runner.
          set +e
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "bikelog-deploy@$UPCLOUD_HOST" "${command[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "result=$(grep -E '^result=' "$RUNNER_TEMP/deploy.log" | tail -1)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0) ;;
            1) echo '::error::The deploy failed; the previous release is serving.'; exit 1 ;;
            2) echo '::error::The deploy failed and the previous release is not healthy either. Check the server now.'; exit 1 ;;
            73) echo '::error::Not enough disk on the server; nothing was pulled.'; exit 1 ;;
            75) echo '::error::Another deploy or job held the lock on the server.'; exit 1 ;;
            *) echo "::error::bikelog-deploy exited $status."; exit 1 ;;
          esac

      - name: Server status
        if: always() && steps.deploy.outcome != 'skipped'
        env:
          UPCLOUD_HOST: ${{ secrets.UPCLOUD_HOST }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=30 \
            "bikelog-deploy@$UPCLOUD_HOST" status 2>&1 | tee "$RUNNER_TEMP/status.log" || true

      - name: Remove the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          WEB: ${{ steps.images.outputs.web }}
          API: ${{ steps.images.outputs.api }}
          MIGRATIONS: ${{ steps.images.outputs.migrations }}
          BACKUP: ${{ steps.images.outputs.backup }}
        run: |
          {
            if [ "$ROLLBACK" = true ]; then echo "### Rollback (${{ job.status }})"; else echo "### Deploy ${{ steps.tag.outputs.tag }} (${{ job.status }})"; fi
            echo
            echo "\`${RESULT:-no result line}\`"
            echo
            if [ "$ROLLBACK" != true ]; then
              echo "| Image | Reference |"
              echo "| --- | --- |"
              for line in "web $WEB" "api $API" "migrations $MIGRATIONS" "backup $BACKUP"; do
                echo "| ${line%% *} | \`${line#* }\` |"
              done
              echo
            fi
            if [ -f "$RUNNER_TEMP/status.log" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/status.log"
              echo '```'
              echo
            fi
            echo "Rollback to the previous release: \`gh workflow run deploy.yml -f rollback=true\`"
          } >> "$GITHUB_STEP_SUMMARY"
